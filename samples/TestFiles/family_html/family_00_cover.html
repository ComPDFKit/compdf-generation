:root {
  /* font */
  --fn-xxs: 6pt;
  --fn-xs: 8pt;
  --fn-sm: 10pt;
  --fn-md: 12pt;
  --fn-lg: 14pt;
  --fn-xlg: 16pt;
  /* color */
  --color-white: #fff;
  --color-white-2: #f2f2f2;
  --color-white-3: #dddddd;
  --color-black: #333;
  --color-blue: #377eb4;
  --color-red: #cf5353;
  --color-green: #65a468;
  --color-yellow: #d0a830;
  --color-purple: #766adc;
  --report-color-1: #337ab7;
  --report-color-2: #fe7a7b;
  --report-color-3: #99d8b9;
  --report-color-4: #fcc557;
  --report-color-5: #6eb9cd;
  --report-color-6: #ff9966;
  --report-color-7: #6097c7;
  --report-color-1-3: rgb(101, 181, 246, 0.3);
  --report-color-2-3: rgba(254, 122, 123, 0.3);
  --report-color-3-3: rgba(153, 216, 185, 0.3);
  --report-color-4-3: rgba(252, 197, 87, 0.3);
  --report-color-5-3: #6097c7;
  --report-color-6-3: rgba(255, 153, 102, 0.3);
  --report-color-7-3: #99d9ea;
  /* Semantic background color variables */
  /* Primary palette (Dark background) */
  --color-bg-primary: var(--report-color-1);
  --color-bg-secondary: var(--report-color-2);
  --color-bg-tertiary: var(--report-color-3);
  --color-bg-quaternary: var(--report-color-4);
  --color-bg-quinary: var(--report-color-5);
  --color-bg-senary: var(--report-color-6);
  --color-bg-septenary: var(--report-color-7);
  /* Light background colors (For example: 30% Opacity) */
  --color-bg-primary-light: var(--report-color-1-3);
  --color-bg-secondary-light: var(--report-color-2-3);
  --color-bg-tertiary-light: var(--report-color-3-3);
  --color-bg-quaternary-light: var(--report-color-4-3);
  --color-bg-quinary-light: var(--report-color-5-3);
  --color-bg-senary-light: var(--report-color-6-3);
  --color-bg-septenary-light: var(--report-color-7-3);
  /* Text colors on backgrounds */
  --color-text: var(--color-black);
  --color-text-2: var(--color-white);
}
/* Financial adviser report palette */
[data-theme="FN"] {
  /* color */
  --report-color-1: #66cccc;
  --report-color-2: #fe7a7b;
  --report-color-3: #99d8b9;
  --report-color-4: #fcc557;
  --report-color-5: #bb97ec;
  --report-color-6: #ff9966;
  --report-color-7: #4d98d9;
  --report-color-1-3: rgba(102, 204, 204, 0.3);
  --report-color-2-3: rgba(254, 122, 123, 0.3);
  --report-color-3-3: rgba(153, 216, 185, 0.3);
  --report-color-4-3: rgba(252, 197, 87, 0.3);
  --report-color-5-3: rgba(187, 151, 236, 0.3);
  --report-color-6-3: rgba(255, 153, 102, 0.3);
  --report-color-7-3: rgba(77, 152, 217, 0.3);
}

/* base */
@page {
  margin: 0; /* Spacing */
  margin-top: 35px;
  margin-bottom: 42px;

}

tr {
  page-break-inside: avoid;

html,
body {
  font-family: "Noto Sans TC", sans-serif;
  font-weight: 300;
  font-size: var(--fn-sm);
  letter-spacing: normal;
  text-align: left;
  color: var(--color-black);
}

.content {
  /*  padding-top: 0.3cm;*/
  padding-left: 1cm;
  padding-right: 0.6cm;
}
/* Header */
header {
  height: 25px;
  background: linear-gradient(
    var(--report-color-7) 41%,
    var(--color-white) 40%
  );
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
}

header::before {
  content: "";
  display: block;
  background-color: var(--report-color-7);
  height: 25px;
  width: 200px;
  transform: skewX(-30deg);
  margin-right: 0.6cm;
  border-radius: 0 0 3px 3px;
}
/* Footer */
footer {
  padding-bottom: 0.3cm;
  margin-top: 10px;
  font-size: var(--fn-xs);
  border-top: 1px solid var(--color-white-2);
}

footer .content {
  padding-top: 0.2cm;
}

/* Colors */
.bg-green {
  background-color: var(--color-green) !important;
  color: var(--color-black) !important;
}

.report-bg-1 {
  background-color: var(--color-bg-primary) !important;
  color: var(--color-text) !important;
}

.report-bg-2 {
  background-color: var(--color-bg-secondary) !important;
  color: var(--color-text) !important;
}

  color: var(--color-text) !important;
}

  color: var(--color-text) !important;
}

  color: var(--color-text-2) !important;

  .report-bg-5 {
    color: var(--color-text) !important;
  }
}

  color: var(--color-text-2) !important;

.d-flex {

}

.flex-column {

}

}

}

.w-100 {
  width: 100% !important;
}
/* Common styles */
.text-left,
.text-start {
  text-align: left !important;
}

.text-center {
  text-align: center !important;
}

.text-right,
.text-end {
  text-align: right !important;
}

.fw-500 {
  font-weight: 500 !important;
}

.fn-xxs {
  font-size: var(--fn-xxs) !important;
}

  font-size: var(--fn-xs) !important;
}

  font-size: var(--fn-sm) !important;
}

}

  font-size: var(--fn-lg) !important;
}

}

.text-nowrap {
  white-space: nowrap !important;
}

.text-wrap-auto {
  word-break: break-all !important;
}

.text-multiline-ellipsis-2 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

/* Labels */
.tag-xs {
  padding: 2px 3px;
  font-weight: 700;
}

.tag-sm {
  padding: 3px 6px;
  font-weight: 700;
}

/* Notes */
.remark,
.remark li {
  list-style: square;
}

.remark li {
  margin-bottom: 5px;
}

/* Review Notes */
ul.list-decimal > li {
  list-style: decimal-leading-zero;
  text-align: left;
  letter-spacing: 5;
  font-size: var(--fn-md);
  line-height: 1.5;
}

/* Tables */
/* Table settings */
table {
  border-collapse: collapse;
  margin-bottom: 15px;
}

table.m-auto {
  margin-left: auto;
  margin-right: auto;
}

table.table-w100 {
  width: 100%;
}

table.table-fixed {
  table-layout: fixed;
}

th,
td {
  padding: 3px 6px;
}

/* All borders */
table.border-type {
  border-top: 1px solid var(--color-white-3);
  border-left: 1px solid var(--color-white-3);
}

table.border-type th,
table.border-type td {
  border-bottom: 1px solid var(--color-white-3);
  border-right: 1px solid var(--color-white-3);
}

/* Bottom borders */
table.border-b-type tr:first-child th,
table.border-b-type tr:first-child td {
  border-top: 1px solid var(--color-white-3);
}

table.border-b-type th,
table.border-b-type td {
  border-bottom: 1px solid var(--color-white-3);
}

table.border-b-type thead th,
table.border-b-type thead td {
  border-bottom: none;
}

table.border-b-type.border-top-none tr:first-child th,
table.border-b-type.border-top-none tr:first-child td {
  border-top: none;
}
/* Alternating rows */
table.table-ebra tr:nth-child (even) {
  background-color: var(--color-white-2);
}

/* Table alignment */
table th {
  text-align: center;
}

table.td-center td {
  text-align: center;
}

table.td-right td {
  text-align: right;
}

/* Separator every five rows */
table.table-bg-5n > tbody > tr:nth-child(5n) td {
  background-color: var(--color-white-2);
}

/* type-a Basic table */
table.type-a th {
  background-color: var(--report-color-1);
  color: var(--color-text-2);
  font-weight: 500;
}

/* Page title */
.page-title {
  font-size: var(--fn-xlg);
  font-weight: 500;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-top: 4px;
}

.item-name {
  color: var(--report-color-7);
}

/*  */
table .policy-info th,
table .policy-info td {
  border-top: 10px solid #fff;
}

table .policy-info:first-child th,
table .policy-info:first-child td {
  border-top: 0;
}

td.checked {
  font-weight: 500;
}

td.checked::before {
  content: "★ ";
  color: var(--color-yellow);
}

/* Policy Assets */
.left-box,
.right-box {
  width: 49%;
}

.sob-list {
  border: 1px solid var(--color-white-3);
  margin-bottom: 10px;
  border-radius: 3px 3px 0 0;
  overflow: hidden;
}

.sob-title {
  padding: 5px 10px;
  font-size: var(--fn-md);
  font-weight: 500;
  background-color: var(--color-white-2);
  display: flex;
  justify-content: flex-start;
  align-items: center;
}

.sob-title > img {
  height: 32px;
}

.sob-sub-title {
  padding: 5px;
  min-width: 48px;
  flex-shrink: 0;
  text-align: center;
  background-color: var(--report-color-5-3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--fn-xs);
}

.sob-item {
  padding: 3px 10px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--color-white-3);
}

.sob-list > .sob-item:last-child {
  border: none;
}

.sob-item-name {
  margin-right: auto;
}

.sob-item-val {
  font-weight: 500;
  white-space: nowrap;
}

.header-banner-sob {
  background: url (images/banner-sob.png);
  height: 120px;
  background-size: cover;
}

/* Divide width equally among six columns */
.td-6 tbody tr > td {
  width: 16.6%;
}

.suggestion-box {
  border: 1px solid var(--color-white-3);
  padding: 15px;
  border-radius: 3px;
}

.suggestion-box p {
  line-height: 1.5;
  margin: 0;
}

.line-clamp-5 {
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 5;
  overflow: hidden;
}

.cover-box {
  position: relative;
}

.cover-img-box {
  margin-bottom: 30px;
}

.cover-img {
  height: 600px;
  object-fit: contain;
}

.ct-name {
  font-size: 24pt;
  font-weight: 500;
}

.ct-name > span {
  margin-right: 3rem;
}

.ct-name > span:last-child {
  margin-right: 0;
}

.ct-content {
  font-size: var(--fn-lg);
  position: absolute;
  top: 22cm;
}

.ct-content td {
  padding: 0px 15px 15px 0;
}

/* Proposal */

header.proposal {
  background: linear-gradient(
    var(--report-color-5) 41%,
    var(--color-white) 40%
  );
}

header.proposal::before {
  background-color: var(--report-color-5);
}

/* Policy features */
.IF .title {
  background-color: var(--report-color-1);
  color: var(--color-black);
  padding: 6px 15px;
  font-weight: 500;
  margin-top: 15px;
}

.IF .B {
  padding: 6px 15px;
  font-weight: 500;
  border-bottom: 1px solid var(--color-white-3);
}

.item-name.proposal {
  color: var(--report-color-5);
}

/* Policy benefits */
.IB .A {
  font-weight: 500;
}

.IB .A:before {
  content: "【";
}

.IB .A:after {
  content: "】";
}

.IB .B {
  font-weight: 500;
}

/* Print client details-Mailing label */
/* 2x7 */
.cust-print-list-2-7 {
  display: grid;
  grid-template-columns: repeat(2, 105mm);
  grid-template-rows: repeat(7, 42.4mm);
  gap: 0px 0px;
}

/* 3x7 */
.cust-print-list-3-7 {
  display: grid;
  grid-template-columns: repeat(3, 70mm);
  grid-template-rows: repeat(7, 42.4mm);
  gap: 0px 0px;
}

/* Fix page breaks */
.cust-print-list-2-7 + .cust-print-list-2-7,
.cust-print-list-3-7 + .cust-print-list-3-7 {
  page-break-before: always;
}

.cust-print-card {
  padding: 20px;
  display: flex;
  flex-flow: column;
  justify-content: space-between;
  align-items: center;
}

.print-add {
  align-self: flex-start;
}

.print-cust-name {
  font-size: 16pt;
}

.print-sender {
  align-self: flex-end;
}

/* Pyramid diagram */
.asset-structure-box {
  display: grid;
  grid-template-columns: 4fr 1fr;
  gap: 20px;
  width: 100%;
}

.pyramid {
  min-width: 852px;
}

.explanation {
  min-width: 150px;
}

.pyramid-box {
  height: 95px;
  width: 200px;
  border: 1px solid #ccc;
  display: flex;
  flex-flow: column;
  justify-content: center;
  align-items: center;
  font-size: var(--fn-md);
  background-color: var(--color-white-2);
}

.explanation-box {
  height: 95px;
  width: auto;
  border: 1px solid #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--fn-lg);
  font-weight: 500;
  background-color: var(--color-white-2);
}

/* Individual review-Monthly Premiums */
.payment-info-height {
  min-height: 1rem;
}

/* Coverage Details */
.table-font-lg-tight,
.table-font-sm-tight {
  letter-spacing: 0;
}

.table-font-lg-tight {
  font-size: 11pt;
}

.table-font-sm-tight {
  font-size: 9pt;
}

.table-font-sm-tight td {
  padding-left: 3px;
  padding-right: 3px;
}

/* Fixed table height */
.text-overflow-1 {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.text-wrapper-center {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc (var(--fn-sm) * 2 + 2px);
}

.text-overflow-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: calc (var(--fn-sm) + 2px);
}

/**/
table:has(.page-head) {
  border-top: none !important;
}

.page-head {
  position: relative;
  background-color: var(--color-white) !important;
  color: var(--color-black) !important;
  border-right: var(--color-white) !important;
  padding-left: 0;
  padding-right: 0;
  border-top: none !important;
  border-bottom: none !important;
}

.page-head .page-title {
  position: relative;
  z-index: 999;
}

.page-head:after {
  content: "";
  position: absolute;
  top: -1px;
  left: -2px;
  width: 4px;
  height: calc(100% + 1px);
  background-color: var(--color-white); /* Line color */
}

.fake-tr {
  height: 0 !important;
  visibility: hidden !important;
}

.fake-tr th {
  padding: 0 !important;
  border: none !important;
}

/* Monthly Premiums-Calendar view */
.premium-card-head {
  background-color: var(--report-color-1);
  color: var(--color-white);
  line-height: 1.5;
  border-radius: 4px 4px 0 0;
  text-align: center;
  font-weight: 900;
}

.premium-item {
  display: grid;
  grid-template-columns: 88px 1fr 1fr;
  gap: 5px;
  height: 22px;
  align-items: center;
}

.premium-item:nth-child (even) {
  background-color: #f2f2f2;
}

.premium-item > div {
  text-align: left;
  letter-spacing: 0;
}

.premium-item .insured {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: 5px;
}

.premium-item .company {
  white-space: nowrap;
  padding-left: 5px;
}

.premium-item .policy-no {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.premium-item .premium {
  text-align: right;
  font-weight: 500;
  padding-right: 5px;
}

.premium-card-footer > div {
  text-align: right;
  font-weight: 500;
  line-height: 1.5;
  background-color: var(--report-color-7-3);
  padding: 0 5px;
}

.premium-box-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
  margin-bottom: 5px;
}

.premium-item-th {
  background-color: var(--report-color-5-3);
  color: var(--color-white);
  font-weight: 500;
}
